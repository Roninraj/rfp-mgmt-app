
services:
  db:
    image: postgres:16-alpine
    container_name: rfp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rfp_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rfp_db
    ports:
      - "5433:5432"
    volumes:
      - rfp_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rfp_user"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rfp_pg_data:
